services:
  ondemandportforward:
    build: .
    image: ondemandportforward:latest
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ondemandportforward", "health"]
      interval: 5m
      timeout: 10s
      retries: 2
