[project]
name = "ondemandportforward"
version = "0.1.0"
description = "On-demand reverse SSH port forwarding triggered by email"
requires-python = ">=3.11"
dependencies = [
    "aioimaplib>=1.1",
    "aiosmtplib>=3.0",
    "python-gnupg>=0.5",
]

[project.scripts]
ondemandportforward = "ondemandportforward.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ondemandportforward"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
